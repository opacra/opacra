# /etc/opacra/opacra.conf - example configuration for a public seed node
# Every option is the command-line flag without the leading "--".

data-dir=/var/lib/opacra
log-file=/var/lib/opacra/opacra.log
log-level=0
max-log-file-size=104850000
# Level 0 records no transaction's origin. Keep it there: raise it only for a debugging
# session, then delete that log. Keep 3 old logs, not Monero's 50.
max-log-files=3

# P2P: listen publicly so other nodes can bootstrap from this seed
p2p-bind-ip=0.0.0.0
p2p-bind-port=29960
out-peers=32
# Home nodes behind routers can't accept connections, so in the first months the seeds are
# the only nodes new users can reach, and each home node keeps a slot. 1000 leaves room for
# growth and makes the slots expensive to fill (audit, 24 Oct 2026; was 128).
in-peers=1000
# allow a few nodes behind one home connection (the default is 1)
max-connections-per-ip=3
no-igd=1

# Other seed nodes you run (keep this list in sync on every seed)
# add-priority-node=203.0.113.10:29960
# add-priority-node=198.51.100.20:29960

# Public restricted RPC for light wallets (optional). Keep the unrestricted RPC on localhost.
rpc-bind-ip=127.0.0.1
rpc-bind-port=29961
# rpc-restricted-bind-ip=0.0.0.0
# rpc-restricted-bind-port=29969
# confirm-external-bind=1

# ZMQ (block/tx notifications for pools and explorers)
zmq-rpc-bind-ip=127.0.0.1
zmq-rpc-bind-port=29962
# zmq-pub=tcp://127.0.0.1:29963

# Emergency checkpoints from DNS (checkpoints.opacra.org and .com, testnet: testpoints.*).
# Seeds enforce them: once the project publishes "height:hash" under both DNSSEC-signed
# domains, this node refuses any reorganisation below that block. Ordinary nodes leave this
# out and only log a warning. See docs/EMERGENCY_CHECKPOINTS.md.
enforce-dns-checkpointing=1
check-updates=disabled

# Seed nodes should keep the full chain
# prune-blockchain=0
